# This repository runs its own gates against itself.
#
# The gates are only worth what they are shown to be worth, and a shared
# definition nobody applies to itself is a definition nobody notices breaking.
# It is also the cheapest test of the "not a JavaScript project" path: this
# repository has no package.json, so the licences and quarantine gates take that
# branch on every run.
name: compliance

on:
  pull_request:
    # The defaults plus ready_for_review: drafts are skipped below, so marking
    # a pull request ready is what runs the gates on it.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full-history:
        description: Scan all history rather than the pull request's range
        type: boolean
        default: false
  schedule:
    # Monday 05:00 UTC — a full-history scan lands before the working week, so a
    # finding is read on the day it appears rather than on Monday of the next one.
    - cron: "0 5 * * 1"

# A second push to the same pull request makes the first run's answer
# irrelevant, so cancel it rather than paying for both. Never cancel the
# scheduled run — it has no successor to replace it.
concurrency:
  group: compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    # Pull requests are gated only when they:
    # - come from a branch of this repository, never a fork: the gates would
    #   execute a stranger's code on our runners. See the README's section on
    #   public repositories.
    # - are ready for review: a draft is still being built up, and skipping it
    #   saves Actions minutes. A draft cannot be merged.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    uses: ./.github/workflows/supply-chain.yml
    # The shared workflow's licences job asks for id-token: write, and a called
    # workflow cannot ask for more than this grants. Nothing in this repository
    # uses the labs registry, so the token is never minted here.
    permissions:
      contents: read
      id-token: write
    with:
      # `github.event.inputs`, not `inputs`: the latter does not exist on a
      # pull_request event, and referencing it fails the whole workflow before a
      # single job starts — with no job to show which expression was at fault.
      full-history: ${{ github.event_name == 'schedule' || github.event.inputs.full-history == 'true' }}
