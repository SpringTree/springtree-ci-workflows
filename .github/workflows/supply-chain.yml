# Supply-chain gates, as a reusable workflow.
#
# Invoked through a caller workflow, never triggered directly, so that a
# repository declares which gates apply to it and with what policy in a file of
# its own rather than by editing the shared definition.
#
# Design notes (do not "simplify" these):
#
# - One job per gate, with no `needs:` between them. Jobs are what run in
#   parallel — steps inside a job are always sequential, so a single job with
#   several steps cannot give both parallelism and "one failure does not stop
#   the others". Independent jobs give both for free.
# - Not a matrix. The gates need different runtimes, and a matrix needs
#   `fail-fast: false` or the first failure cancels its siblings — which is the
#   behaviour we are specifically trying not to have, and it fails silently.
# - Each job name becomes a required status check, reported as
#   `<caller job> / <job>`. Renaming a job silently turns a required check into
#   one that never reports, so the ruleset and these names change together.
# - Tools are installed as pinned binaries with their checksums, not as
#   third-party actions. Three reasons: gitleaks-action requires a licence key
#   for organisation accounts, so a secrets gate would itself need a secret and
#   a call to its vendor; a mutable action reference such as `@main` is exactly
#   what the quarantine gate exists to prevent; and pinning the binary means CI
#   runs the same version a developer runs locally.
# - A version is pinned only once the release has cleared the same quarantine
#   window every other dependency has to clear. Reaching for the newest release
#   here would exempt the security tooling from the rule it exists to enforce.
# - The quarantine gate is written out inline rather than calling the developer
#   tool that performs the equivalent checks on a workstation. The two have
#   different subjects — committed files here, a machine's global configuration
#   there — and sharing an implementation would mean giving every caller a way
#   to reach a script in this repository, which needs a cross-repository token
#   that the per-repository `GITHUB_TOKEN` is not.

name: supply-chain

on:
  workflow_call:
    inputs:
      full-history:
        description: >-
          Scan every commit rather than only the pull request's range. The
          weekly schedule sets this; a pull request does not. A range covers
          everything a change introduces, while a full scan also re-examines
          history that a force-push could have rewritten — worth doing, but not
          worth doing on every push, because it gets slower forever.
        type: boolean
        default: false
      code-scan-rules:
        description: >-
          Semgrep ruleset. A registry pack is a mutable reference — the rules
          behind it change without a version to pin — so a rule added upstream
          can fail a build that passed with no local change. That is accepted
          here and not for the scanning binaries, because a rule is a
          declarative pattern rather than code: a bad one produces a wrong
          verdict, where a bad binary produces arbitrary execution. Vendor a
          snapshot into the repository if that trade stops being acceptable.
        type: string
        default: "p/default"
      min-release-age-days:
        description: >-
          How long a package version must have existed before a build may
          install it. The single place the quarantine window is stated: the
          seconds value Bun wants is derived from it, so the two settings cannot
          come to disagree. Raising it here raises it for every caller at once.
        type: number
        default: 7
      quarantine-exclude:
        description: >-
          Semicolon-separated globs of package.json paths the quarantine gate
          should ignore. For a manifest that is genuinely not an install
          location and that the "declares no dependencies" rule does not already
          skip — a fixture with dependencies it never installs, say. Each
          exclusion is a repository saying a path is exempt, so it belongs in
          the caller where someone can be asked why.
        type: string
        default: ""

# Read-only. No gate writes to the repository, and one that could would be a
# more attractive target than the thing it guards. The licences job adds
# id-token: write for itself only; see that job.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRUFFLEHOG_VERSION: "3.97.5"
  TRUFFLEHOG_SHA256: "e3d97199c565c37ca6152750197f667e08ae6a1edf5911fbdec168622b28620c"
  # The springtree-labs registry identity. Fixed here rather than an input, for
  # the same reason the licence allow-list is: which identity a gate runs as is
  # an organisation decision. gha-consumer can only read the labs registries,
  # and a repository can use it only once springtree-labs lists it in
  # github_consumer_repositories.
  LABS_WORKLOAD_IDENTITY_PROVIDER: "projects/232362795221/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
  LABS_SERVICE_ACCOUNT: "gha-consumer@springtree-labs.iam.gserviceaccount.com"

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the range scan needs the base commit to diff against,
          # and the scheduled scan needs everything.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          # The expected digest is committed alongside rather than read from the
          # release's own checksums file: anyone able to replace the artefact
          # could replace that file too, so verifying against it proves nothing.
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install TruffleHog
        run: |
          set -euo pipefail
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${archive}"
          echo "${TRUFFLEHOG_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" trufflehog
          sudo install -m 0755 trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      # Every value an expression produces reaches the shell through env rather
      # than being pasted into the script body. Interpolating directly means the
      # value is substituted as text before the shell parses the line, so a
      # caller-supplied input becomes caller-supplied shell.
      - name: Determine scan range
        id: range
        env:
          FULL_HISTORY: ${{ inputs.full-history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A pull request scans only what it introduces; everything else scans
          # the lot. The base SHA is the commit the PR forked from, so the range
          # is exactly the change under review.
          if [ "$FULL_HISTORY" = "true" ] || [ -z "$BASE_SHA" ]; then
            echo "log-opts=" >> "$GITHUB_OUTPUT"
            echo "scope=full history" >> "$GITHUB_OUTPUT"
            echo "scanning: full history"
          else
            echo "log-opts=--log-opts=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "scope=${BASE_SHA}..${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "scanning: ${BASE_SHA}..${HEAD_SHA}"
          fi

      # Git mode, never `gitleaks dir`. `dir` scans the filesystem with no
      # .gitignore support at all — its only ignore mechanisms are
      # .gitleaksignore, a baseline file and inline allow comments — so it
      # flags every developer's local .env on every run. In CI that stays
      # invisible, because a fresh checkout has no .env: the enforcing copy
      # would look green while the local copy cried wolf, which is how a gate
      # stops being read.
      - name: gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: |
          set -euo pipefail
          # Unquoted on purpose: empty must expand to no argument at all, and
          # the value is either empty or a single --log-opts=... token.
          # shellcheck disable=SC2086
          gitleaks git --redact --no-banner --verbose $LOG_OPTS

      # Verification is deliberately off. With it on, every candidate secret is
      # sent to the provider's API to see whether it authenticates — an
      # outbound transmission of a live credential, by us, to a party we have no
      # agreement with. The two tools are carried for the union of their
      # detector sets, not for verification.
      - name: TruffleHog
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # JSON rather than --fail, so each finding can be checked against
          # the line it came from before it decides the result. Logs go to
          # stderr; stdout carries one JSON object per finding.
          findings="$(mktemp)"
          if [ -n "$LOG_OPTS" ]; then
            trufflehog git "file://." \
              --since-commit "$BASE_SHA" \
              --branch "$HEAD_SHA" \
              --no-verification --no-update --json > "$findings"
          else
            trufflehog git "file://." --no-verification --no-update --json > "$findings"
          fi

          # Package integrity hashes are base64 or hex, so a detector built as
          # "keyword, then N alphanumerics" fires on them by chance: the TLy
          # detector matched "TLy" inside an npm sha512 hash. Upstream fixes
          # this one detector at a time (trufflehog#3370, #4631, #4632) and
          # suggests excluding lockfiles, which would also stop scanning the
          # registry tokens a lockfile can carry in a resolved URL.
          #
          # So lockfiles stay scanned, every detector stays on, and only a
          # finding whose value lies wholly inside a hash on its own line is
          # set aside. The hash forms:
          # - sha1/256/384/512-<base64>   SRI integrity (npm, Bun, Yarn, pnpm)
          # - sha1/256/384/512:<hex>      pip and Poetry hashes
          # - h1:<base64>                 go.sum
          # A secret disguised as one of these would pass; that is the trade.
          hash_pattern='sha(1|256|384|512)-[A-Za-z0-9+/]+={0,2}|sha(1|256|384|512):[0-9A-Fa-f]+|h1:[A-Za-z0-9+/]+={0,2}'

          kept=0
          while IFS= read -r finding; do
            raw="$(jq -r '.Raw // ""' <<< "$finding")"
            commit="$(jq -r '.SourceMetadata.Data.Git.commit // ""' <<< "$finding")"
            file="$(jq -r '.SourceMetadata.Data.Git.file // ""' <<< "$finding")"
            line="$(jq -r '.SourceMetadata.Data.Git.line // ""' <<< "$finding")"
            detector="$(jq -r '.DetectorName // "unknown"' <<< "$finding")"

            # Any field missing, or the line unreadable, leaves the finding
            # standing: the filter only sets a finding aside on evidence,
            # never for lack of it.
            content=""
            if [ -n "$raw" ] && [ -n "$commit" ] && [ -n "$file" ] && [[ "$line" =~ ^[0-9]+$ ]]; then
              content="$(git show "${commit}:${file}" 2>/dev/null | sed -n "${line}p")" || content=""
            fi
            if [ -n "$content" ] &&
              grep -oE "$hash_pattern" <<< "$content" | grep -qF -- "$raw"; then
              echo "::notice title=TruffleHog::${detector} match in ${file}:${line} (${commit:0:7}) lies inside a package integrity hash — not a secret"
              continue
            fi

            kept=$((kept + 1))
            printf 'Found unverified result\n  Detector: %s\n  File:     %s:%s\n  Commit:   %s\n  Raw:      %s\n\n' \
              "$detector" "$file" "$line" "$commit" "$raw"
          done < <(jq -c 'select(.DetectorName != null)' "$findings")

          if [ "$kept" -gt 0 ]; then
            echo "::error title=TruffleHog::${kept} candidate secret(s) found"
            exit 1
          fi
          echo "TruffleHog: no candidate secrets"

  licences:
    name: licences
    runs-on: ubuntu-latest
    # id-token: write lets a step mint a GitHub OIDC token for the calling
    # repository. It is granted to this job alone, which needs it to read the
    # labs registry; the other gates never get it.
    #
    # A called workflow cannot ask for more than its caller grants: every
    # caller's supply-chain job must grant id-token: write, or no gate starts.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A directory with its own lockfile is an independent install root: that
      # is what a lockfile means. Installing only at the repository root would
      # miss every subdirectory that resolves its own dependency tree, and a
      # licence gate that never saw those dependencies reports green for a tree
      # it has not read. A workspace package has no lockfile of its own — its
      # dependencies resolve through the root's — so this finds each tree once.
      - name: Find install roots
        id: roots
        run: |
          set -euo pipefail
          # `git ls-files` sees tracked files only, so a generated tree cannot
          # add phantom roots. The grep narrows the pathspec globs to the exact
          # basenames, which would otherwise also match `my-bun.lock`.
          #
          # Every node_modules exclusion in this file carries `glob` magic.
          # Without it `**` is not special, so `**/node_modules/**` needs a
          # directory in front and misses a node_modules committed at the
          # root. In the licence check that made every dependency count as a
          # first-party package, and the gate passed without checking any.
          roots="$(git ls-files -- '*bun.lock' '*bun.lockb' '*package-lock.json' ':(exclude,glob)**/node_modules/**' |
            grep -E '(^|/)(bun\.lock|bun\.lockb|package-lock\.json)$' |
            while read -r lockfile; do dirname "$lockfile"; done |
            sort -u | tr '\n' ' ')" || true
          # `|| true` because grep exits 1 when nothing matches, which under
          # `set -e` would fail the step on exactly the repositories that have
          # no lockfile — the case this discovery exists to detect.
          echo "roots=${roots}" >> "$GITHUB_OUTPUT"

          if [ -z "$roots" ]; then
            # Distinguish the two ways of having nothing to do, because they
            # mean different things: no manifests at all is a repository this
            # gate does not apply to, while manifests with no lockfile is a
            # dependency tree nobody can reproduce — and which this gate
            # therefore cannot read.
            if git ls-files -- '*package.json' ':(exclude,glob)**/node_modules/**' |
              grep -qE '(^|/)package\.json$'; then
              echo "::warning title=Licence check::package.json found but no lockfile — nothing could be installed, so no licences were checked"
            else
              echo "no package manifests — not a JavaScript project"
            fi
          else
            echo "install roots: ${roots}"
          fi

      # Bun runs the checker and the exemption evaluator whatever the project
      # uses; Node is there for the npm roots.
      - if: steps.roots.outputs.roots != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - if: steps.roots.outputs.roots != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          # Off, because setup-node turns it on by itself when package.json has a
          # packageManager field. A restored cache is a tree this gate did not
          # install, and a cache another branch wrote is one way to poison it.
          package-manager-cache: false

      # Logging in only where a committed .npmrc points a scope at the labs
      # registry keeps every other repository from minting a cloud identity it
      # never uses.
      - name: Find labs registries
        id: labs
        if: steps.roots.outputs.roots != ''
        run: |
          set -euo pipefail
          # The pattern is the trust boundary, not a convenience: the token is
          # written for every URL it matches, and the URLs come from files a
          # pull request can change. It admits only Artifact Registry npm
          # repositories in the springtree-labs project, so a pull request
          # cannot point the token at a host of its choosing.
          #   https://<region>-npm.pkg.dev/springtree-labs/<repository>/
          labs_registry_pattern='https://[a-z0-9-]+-npm\.pkg\.dev/springtree-labs/[A-Za-z0-9_-]+/'
          registries="$(git ls-files -- '*.npmrc' ':(exclude,glob)**/node_modules/**' |
            grep -E '(^|/)\.npmrc$' |
            while read -r npmrc; do
              # Comment lines are dropped so a URL mentioned in prose does not
              # trigger a login.
              grep -vE '^[[:space:]]*[#;]' "$npmrc" | grep -oE "$labs_registry_pattern" || true
            done | sort -u | tr '\n' ' ')" || true
          echo "registries=${registries}" >> "$GITHUB_OUTPUT"
          echo "labs registries: ${registries:-none}"

      # An access token rather than the default credentials file: it is
      # read-only, short-lived and limited to the labs registries. The action
      # masks it in the log.
      - name: Log in to the labs registry
        id: labs-auth
        if: steps.labs.outputs.registries != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.LABS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.LABS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      # Reading the installed tree rather than the GitHub dependency graph is the
      # point, not an implementation detail: the graph does not fully resolve
      # Bun lockfiles in either format, so on a Bun repository it reports a
      # fraction of the installed tree and a licence check built on it would
      # pass without having seen most of the dependencies.
      #
      # Each root installs with the package manager its lockfile belongs to.
      # Bun on an npm root migrates package-lock.json to its own format and
      # then fails, because the lockfile it was told to keep has changed.
      #
      # Frozen, because a lockfile that drifts inside CI would have the gate pass
      # against dependencies nobody reviewed: `bun install --frozen-lockfile`,
      # and `npm ci`, which always is.
      - name: Licence check
        if: steps.roots.outputs.roots != ''
        env:
          # SPDX identifiers permitted in the dependency tree. An allow-list
          # rather than a deny-list: a licence nobody has classified yet is
          # refused until someone looks at it, and a malformed list refuses
          # everything rather than permitting everything.
          #
          # Deliberately not an input. Which licences are acceptable is an
          # organisation decision, made once and reviewed here; a calling
          # repository can only accept individual packages, through its
          # exemptions file.
          #
          # OFL-1.1 is the SIL Open Font License, under which most open fonts
          # ship. It permits embedding and redistributing a font in any product
          # and puts no conditions on the code around it.
          #
          # CC0-1.0 is Creative Commons' public-domain dedication: no
          # conditions on use. It waives copyright only and grants no patent
          # licence, which matters little for the data packages and small
          # utilities it usually covers, such as the SPDX licence lists.
          #
          # CC-BY-3.0 and CC-BY-4.0 are Creative Commons Attribution: use and
          # adapt freely, credit the source when sharing it. No heavier than
          # MIT's notice requirement, and common on data packages such as
          # caniuse-lite. The -SA, -NC and -ND variants are separate
          # identifiers and stay refused.
          #
          # MIT-0 is MIT No Attribution: the MIT grant without the condition to
          # keep the copyright notice, so strictly more permissive than MIT.
          ALLOWED_LICENCES: "0BSD;Apache-2.0;BlueOak-1.0.0;BSD-2-Clause;BSD-3-Clause;CC-BY-3.0;CC-BY-4.0;CC0-1.0;ISC;MIT;MIT-0;OFL-1.1;Python-2.0;Unlicense"
          INSTALL_ROOTS: ${{ steps.roots.outputs.roots }}
          # A fixed path, so a CODEOWNERS line on it cannot be sidestepped by
          # pointing the gate at a file nobody owns.
          LICENCE_EXEMPTIONS: licence-exemptions.json
          LABS_REGISTRIES: ${{ steps.labs.outputs.registries }}
          LABS_REGISTRY_TOKEN: ${{ steps.labs-auth.outputs.access_token }}
        run: |
          set -uo pipefail

          # The runner hands every step of a job with id-token: write the means
          # to mint an OIDC token. This step runs the third-party checker, which
          # has no use for it.
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL

          # Note: GitHub invokes this as `bash -e {0}`, so errexit is on however
          # this line reads. Every step below that may legitimately fail is
          # guarded — `|| exit 1` where it is fatal, `|| status=1` where the
          # remaining roots should still be checked.

          # Packages whose own metadata names a licence in a form no tool can
          # match, stated here once for the whole organisation rather than
          # re-decided in every repository that happens to depend on them.
          #
          # Each entry carries the SHA-256 of the licence text it was read from.
          # A clarification is a statement about evidence, so it is bound to
          # that evidence: if upstream changes the text, the checksum stops
          # matching and the gate fails until someone reads it again. That is
          # the difference between this and simply excluding the package.
          #
          # `licenseFile` resolves inside the package's own directory, not the
          # repository — "LICENSE", never "node_modules/x/LICENSE".
          #
          # url-template declares "license": "BSD", which is not an SPDX
          # identifier. Its text is BSD-3-Clause verbatim, three clauses
          # including no-endorsement. It arrives through googleapis-common, so
          # every repository using a Google client library meets it.
          clarifications="$(mktemp)"
          cat > "$clarifications" <<'CLARIFICATIONS'
          {
            "url-template@2.0.8": {
              "licenses": "BSD-3-Clause",
              "licenseFile": "LICENSE",
              "checksum": "70723b90e3f26aa2808616e846cd8cd349fe33864fd328a91a5bb9d33e58e9d9"
            }
          }
          CLARIFICATIONS

          # Only this set exists. A clarification states what licence a package
          # has, so a repository-local one could restate a refused licence as an
          # allowed one; that makes it a licence decision, and those are made
          # here.

          # The checker reports the repository's own packages too, and a private
          # one without a "license" field reads as UNLICENSED, so every private
          # repository with a lockfile failed on itself before reaching a single
          # dependency. Those packages are ours: there is nothing to license.
          #
          # Excluded by the name@version of each tracked package.json, not with
          # --excludePrivatePackages. "private": true only stops a package being
          # published to a registry; a git or file: dependency can carry it and
          # still be someone else's proprietary code, which must be refused.
          # A manifest without a version is excluded by name alone.
          first_party="$(git ls-files -- '*package.json' ':(exclude,glob)**/node_modules/**' |
            grep -E '(^|/)package\.json$' |
            while read -r manifest; do
              jq -r 'select(.name != null) | if .version then "\(.name)@\(.version)" else .name end' "$manifest" 2>/dev/null || true
            done | sort -u | paste -sd ';' -)" || true
          echo "first-party packages excluded: ${first_party:-none}"

          # Packages a repository accepts despite a licence that is not on the
          # allow-list. Each exemption names a package and the one licence it is
          # accepted under; the evaluator turns that into the exact installed
          # name@version keys to exclude, so a relicensed package is refused
          # again. TypeScript rather than jq: it matches versions and reads the
          # installed manifests for optional dependencies.
          evaluator="$(mktemp -d)/licence-exemptions.ts"
          cat > "$evaluator" <<'EVALUATOR'
          // Licence exemptions: which installed packages a repository accepts despite a
          // licence that is not on the allow-list.
          //
          // - An exemption names a package (any version), a major (name@1) or an exact
          //   version, and the one licence it is accepted under.
          // - It applies only while the package still declares that licence, so a
          //   relicensed package is refused again.
          // - withOptionalDependencies extends it to the package's own optional
          //   dependencies (per-platform binaries), under the same licence only.
          //
          // Usage:
          //   validate <rules.json>                          print the rules, exit 1 if malformed
          //   evaluate <rules.json> <inventory.json> <used> <allowed>
          //       print the name@version keys to exclude, ";"-separated, and append each
          //       matched rule key to <used>; <allowed> is the ";"-separated allow-list
          import { appendFileSync, readFileSync } from "node:fs";
          import { join } from "node:path";

          type Rule = { licence: string; reason: string; withOptionalDependencies: boolean };
          type InventoryEntry = { licenses?: unknown; path?: unknown };

          // A package name with an optional @scope/, then optionally @major or @x.y.z
          // (with a pre-release or build suffix). Ranges and tags are refused.
          const SELECTOR = /^(@[A-Za-z0-9._~-]+\/)?[A-Za-z0-9._~-]+(@\d+(\.\d+\.\d+([-+][0-9A-Za-z.+-]+)?)?)?$/;
          const RULE_FIELDS = new Set(["licence", "reason", "withOptionalDependencies"]);

          function annotate(level: "error" | "warning", message: string): void {
            console.error(`::${level} title=Licence exemptions::${message}`);
          }

          function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }

          function loadRules(path: string): Map<string, Rule> {
            let parsed: unknown;
            try {
              parsed = JSON.parse(readFileSync(path, "utf8"));
            } catch {
              annotate("error", `${path} is not valid JSON`);
              process.exit(1);
            }
            if (!isRecord(parsed)) {
              annotate("error", `${path} must be one JSON object keyed by package`);
              process.exit(1);
            }

            const rules = new Map<string, Rule>();
            const problems: string[] = [];
            for (const [selector, value] of Object.entries(parsed)) {
              if (!SELECTOR.test(selector)) {
                problems.push(`${selector}: use a package name, name@major or name@x.y.z`);
                continue;
              }
              if (!isRecord(value)) {
                problems.push(`${selector}: needs an object with "licence" and "reason"`);
                continue;
              }
              // An unknown field is refused so a typo such as "license" cannot leave an
              // entry silently doing nothing.
              const unknownFields = Object.keys(value).filter((field) => !RULE_FIELDS.has(field));
              const { licence, reason, withOptionalDependencies } = value;
              const entryProblems = [
                unknownFields.length > 0 ? `unknown field(s) ${unknownFields.join(", ")}` : "",
                typeof licence !== "string" || licence.trim() === "" ? "needs a licence" : "",
                typeof reason !== "string" || reason.trim() === "" ? "needs a reason" : "",
                withOptionalDependencies !== undefined && typeof withOptionalDependencies !== "boolean"
                  ? "withOptionalDependencies must be true or false"
                  : "",
              ].filter(Boolean);
              if (entryProblems.length > 0) {
                problems.push(`${selector}: ${entryProblems.join("; ")}`);
                continue;
              }
              rules.set(selector, {
                licence: String(licence).trim(),
                reason: String(reason).trim(),
                withOptionalDependencies: withOptionalDependencies === true,
              });
            }

            if (problems.length > 0) {
              for (const problem of problems) annotate("error", problem);
              process.exit(1);
            }
            return rules;
          }

          /** Splits "name@version" at the last @, so a scoped "@scope/name@1.2.3" works. */
          function splitKey(key: string): { name: string; version: string } {
            const at = key.lastIndexOf("@");
            return at > 0 ? { name: key.slice(0, at), version: key.slice(at + 1) } : { name: key, version: "" };
          }

          function selectorMatches(selector: string, name: string, version: string): boolean {
            const { name: selectorName, version: selectorVersion } = splitKey(selector);
            if (selectorName !== name) return false;
            if (selectorVersion === "") return true;
            if (/^\d+$/.test(selectorVersion)) return version.split(".")[0] === selectorVersion;
            return version === selectorVersion;
          }

          function licenceOf(entry: InventoryEntry): string {
            const licences = entry.licenses;
            if (Array.isArray(licences)) return licences.map(String).join(" OR ");
            return typeof licences === "string" ? licences : "";
          }

          function optionalDependencyNames(packagePath: unknown): string[] {
            if (typeof packagePath !== "string") return [];
            try {
              const manifest: unknown = JSON.parse(readFileSync(join(packagePath, "package.json"), "utf8"));
              if (!isRecord(manifest) || !isRecord(manifest.optionalDependencies)) return [];
              return Object.keys(manifest.optionalDependencies);
            } catch {
              return [];
            }
          }

          function evaluate(
            rules: Map<string, Rule>,
            inventoryPath: string,
            usedPath: string,
            allowed: Set<string>,
          ): string[] {
            const parsed: unknown = JSON.parse(readFileSync(inventoryPath, "utf8"));
            const inventory = isRecord(parsed) ? parsed : {};
            const packages = Object.entries(inventory).map(([key, value]) => ({
              key,
              ...splitKey(key),
              licence: licenceOf(isRecord(value) ? value : {}),
              path: isRecord(value) ? value.path : undefined,
            }));

            const excluded = new Set<string>();
            for (const [selector, rule] of rules) {
              for (const installed of packages) {
                if (!selectorMatches(selector, installed.name, installed.version)) continue;
                appendFileSync(usedPath, `${selector}\n`);

                if (installed.licence !== rule.licence) {
                  // Relicensed to something already allowed: the gate passes on its own,
                  // and the exemption is dead weight rather than a problem.
                  if (allowed.has(installed.licence)) {
                    annotate(
                      "warning",
                      `${installed.key} is now ${installed.licence}, which is allowed — ` +
                        `the exemption for ${selector} is no longer needed`,
                    );
                    continue;
                  }
                  annotate(
                    "error",
                    `${installed.key} is now ${installed.licence || "without a licence"}, but its ` +
                      `exemption accepts ${rule.licence} — the exemption no longer applies`,
                  );
                  continue;
                }
                excluded.add(installed.key);

                if (!rule.withOptionalDependencies) continue;
                const optionalNames = new Set(optionalDependencyNames(installed.path));
                for (const candidate of packages) {
                  if (!optionalNames.has(candidate.name)) continue;
                  // Same licence only: an optional dependency under another licence is
                  // a separate decision, and the normal check reports it.
                  if (candidate.licence === rule.licence) excluded.add(candidate.key);
                }
              }
            }
            return [...excluded];
          }

          const [mode, rulesPath, inventoryPath, usedPath, allowedList] = process.argv.slice(2);
          if (!rulesPath) {
            annotate("error", "usage: licence-exemptions.ts validate|evaluate <rules.json> ...");
            process.exit(2);
          }
          const rules = loadRules(rulesPath);

          if (mode === "validate") {
            console.log("licence exemptions:");
            for (const [selector, rule] of rules) {
              const optional = rule.withOptionalDependencies ? " (with optional dependencies)" : "";
              console.log(`  ${selector} — ${rule.licence}${optional} — ${rule.reason}`);
            }
          } else if (mode === "evaluate" && inventoryPath && usedPath) {
            const allowed = new Set((allowedList ?? "").split(";").filter(Boolean));
            console.log(evaluate(rules, inventoryPath, usedPath, allowed).join(";"));
          } else {
            annotate("error", `unknown mode ${mode ?? "(none)"}`);
            process.exit(2);
          }
          EVALUATOR

          exemption_rules=""
          # Absolute, because the evaluator runs from inside each install root.
          if [ -f "$LICENCE_EXEMPTIONS" ]; then
            exemption_rules="$(pwd)/$LICENCE_EXEMPTIONS"
            bun "$evaluator" validate "$exemption_rules" || exit 1
          fi
          # Exemption keys that matched an installed package in any root.
          exemptions_used="$(mktemp)"

          # Deliberately not --clarificationsMatchAll. It fails when any entry
          # went unused, which is the normal case for a shared file: most
          # repositories will not contain most of these packages. Staleness is
          # caught by the checksum instead, which is bound to the package rather
          # than to the repository.
          #
          # Every root is checked even after one fails, for the same reason the
          # gates themselves do not stop at the first failure: one run should
          # report everything there is to fix.
          #
          # Two passes: every root installs first, then the registry token is
          # removed, then the checker runs. The checker needs no registry
          # access, so it never runs alongside the token.
          status=0
          installed_roots=""

          # The labs token goes in the user-level .npmrc, which npm and Bun
          # both read, keyed to each labs registry URL so neither sends it
          # anywhere else. Never the project's .npmrc: that file is tracked.
          #   //europe-west4-npm.pkg.dev/springtree-labs/npm/:_authToken=<token>
          user_npmrc="$HOME/.npmrc"
          user_npmrc_backup=""
          if [ -n "$LABS_REGISTRY_TOKEN" ]; then
            if [ -f "$user_npmrc" ]; then
              user_npmrc_backup="$(mktemp)"
              cp "$user_npmrc" "$user_npmrc_backup"
            fi
            for registry in $LABS_REGISTRIES; do
              printf '//%s:_authToken=%s\n' "${registry#https://}" "$LABS_REGISTRY_TOKEN" >> "$user_npmrc"
            done
          fi

          # --ignore-scripts: the checker reads package metadata and licence
          # files, so no dependency's install script ever needs to run. Letting
          # them run would execute whatever code a pull request's new
          # dependencies ship, on a runner, before anyone has reviewed it.
          for root in $INSTALL_ROOTS; do
            printf '\n\033[1m%s\033[0m — install\n' "$root"
            if (
              cd "$root" || exit 1
              # A root is found by its lockfile, so exactly one of these
              # branches has one. Both lockfiles is a repository mid-migration:
              # Bun's is installed, as before, and npm's is left unread.
              if [ -f bun.lock ] || [ -f bun.lockb ]; then
                if [ -f package-lock.json ]; then
                  echo "::warning title=Licence check::${root} has both a Bun lockfile and package-lock.json — installed with Bun, so package-lock.json was not read. Remove the one that is not used."
                fi
                bun install --frozen-lockfile --ignore-scripts || exit 1
              else
                npm ci --ignore-scripts || exit 1
              fi
            ); then
              installed_roots="${installed_roots} ${root}"
            else
              status=1
            fi
          done

          # The token leaves before the checker arrives.
          if [ -n "$LABS_REGISTRY_TOKEN" ]; then
            if [ -n "$user_npmrc_backup" ]; then
              mv "$user_npmrc_backup" "$user_npmrc"
            else
              rm -f "$user_npmrc"
            fi
          fi
          unset LABS_REGISTRY_TOKEN

          for root in $installed_roots; do
            printf '\n\033[1m%s\033[0m — licences\n' "$root"
            (
              cd "$root" || exit 1
              excluded="$first_party"
              if [ -n "$exemption_rules" ]; then
                # Every installed package with its licence, our own excluded:
                # the evaluator's input.
                inventory="$(mktemp)"
                bunx --bun @lizenz/checker@0.0.2 --json \
                  --clarificationsFile "$clarifications" \
                  --excludePackages "$first_party" > "$inventory" || exit 1
                exempted="$(bun "$evaluator" evaluate "$exemption_rules" "$inventory" \
                  "$exemptions_used" "$ALLOWED_LICENCES")" || exit 1
                if [ -n "$exempted" ]; then echo "exempted here: $exempted"; fi
                excluded="$(printf '%s;%s' "$first_party" "$exempted" | sed 's/^;//; s/;$//')"
              fi
              bunx --bun @lizenz/checker@0.0.2 \
                --clarificationsFile "$clarifications" \
                --excludePackages "$excluded" \
                --onlyAllow "$ALLOWED_LICENCES" \
                --summary
            ) || status=1
          done

          # An exemption that matches no installed package is a decision about
          # nothing. Warned, not failed: it is harmless, only stale.
          if [ -n "$exemption_rules" ]; then
            jq -r 'keys[]' "$exemption_rules" | while IFS= read -r selector; do
              grep -qxF "$selector" "$exemptions_used" ||
                echo "::warning title=Licence exemptions::$selector matches no installed package — remove it from $LICENCE_EXEMPTIONS"
            done
          fi
          exit "$status"

  code:
    name: code
    runs-on: ubuntu-latest
    # Pinned by digest rather than tag: a tag can be repointed at a different
    # image, which is the same mutable-reference problem the quarantine gate
    # exists to prevent.
    container:
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A pull request is answerable for what it introduces, not for everything
      # that was already there. Without a baseline every pre-existing finding
      # blocks every change, which is how a gate gets switched off rather than
      # satisfied. The scheduled run has no baseline and sees the lot.
      - name: Semgrep
        env:
          FULL_HISTORY: ${{ inputs.full-history }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCAN_RULES: ${{ inputs.code-scan-rules }}
        run: |
          set -euo pipefail
          baseline=""
          if [ "$FULL_HISTORY" != "true" ] && [ -n "$BASE_SHA" ]; then
            baseline="--baseline-commit $BASE_SHA"
          fi

          # Metrics off explicitly. They are already off for local rule files,
          # but default to on the moment a registry ruleset is used, so setting
          # it keeps telemetry off if the ruleset input is ever changed.
          # shellcheck disable=SC2086
          semgrep scan \
            --config "$SCAN_RULES" \
            --metrics off \
            --error \
            $baseline

  quarantine:
    name: quarantine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The enforcing copy of the package-quarantine configuration. A developer's
      # own copy of these settings protects that developer only, so the committed
      # files are what the control actually rests on — and nothing but CI can
      # insist they are still there and still correct.
      - name: Package quarantine configuration
        env:
          MIN_RELEASE_AGE_DAYS: ${{ inputs.min-release-age-days }}
          QUARANTINE_EXCLUDE: ${{ inputs.quarantine-exclude }}
        run: |
          set -uo pipefail

          # Every finding is reported in one run: a gate that stops at the first
          # problem turns one fix into several pushes, and the second problem is
          # discovered only after the first is merged.
          #
          # That is NOT achieved by leaving `set -e` out. GitHub invokes every
          # run block as `bash -e {0}`, so errexit is already on and `set -uo
          # pipefail` only adds to it — it cannot take it away. Every command
          # below whose failure is an ordinary outcome rather than a fault must
          # therefore be guarded explicitly. A grep that legitimately matches
          # nothing exits 1 and would end the step mid-report, which is exactly
          # how this gate once died after two green lines.

          failures=0
          checked=0

          pass() { printf '  \033[32m✓\033[0m %s\n' "$1"; }
          warn() { printf '  \033[33m⚠\033[0m %s\n' "$2"; printf '::warning file=%s,title=Package quarantine::%s\n' "$1" "$2"; }
          fail() {
            printf '  \033[31m✗\033[0m %s\n' "$2"
            # A workflow annotation attaches the finding to the file in the pull
            # request's diff, where whoever has to fix it is already looking.
            printf '::error file=%s,title=Package quarantine::%s\n' "$1" "$2"
            failures=$((failures + 1))
          }

          # Every tracked package.json is a potential install location, at any
          # depth. Checking only the repository root would exempt every monorepo
          # that keeps its manifests in subdirectories, which is most of them.
          #
          # `git ls-files` rather than `find`: it sees tracked files only, so a
          # vendored or generated tree cannot add phantom locations, and the
          # pathspec drops a committed node_modules. The grep narrows `*package
          # .json` to the exact basename — the pathspec glob would also match
          # something like `my-package.json`.
          manifests="$(git ls-files -- '*package.json' ':(exclude,glob)**/node_modules/**' |
            grep -E '(^|/)package\.json$' || true)"

          if [ -z "$manifests" ]; then
            echo "no package.json anywhere — not a JavaScript project, nothing to check"
            exit 0
          fi

          # Tracked lockfiles decide which package manager an install location
          # uses, so only that manager's configuration is required there.
          # Same pathspec and basename narrowing as the manifests above.
          lockfiles="$(git ls-files -- '*package-lock.json' '*bun.lock' '*bun.lockb' ':(exclude,glob)**/node_modules/**' |
            grep -E '(^|/)(package-lock\.json|bun\.lockb?)$' || true)"

          # Sets uses_npm, uses_bun and lockfile_source for the install location $1.
          #
          # The nearest lockfile at or above the directory wins, because a
          # workspace package resolves through its root's lockfile and has none
          # of its own. No lockfile anywhere above leaves the manager unknown,
          # and both configurations stay required: guessing wrong would exempt
          # the location without anyone noticing. A Bun run in an npm project
          # creates bun.lock, and committing it switches the Bun check back on.
          detect_package_managers() {
            uses_npm=false
            uses_bun=false
            lockfile_source=""
            search_directory="$1"
            while :; do
              if [ "$search_directory" = "." ]; then search_prefix=""; else search_prefix="${search_directory}/"; fi
              # -x -F: the whole line, literally, so a dot in a directory name
              # is not a regex wildcard.
              if grep -qxF "${search_prefix}package-lock.json" <<< "$lockfiles"; then
                uses_npm=true
                lockfile_source="${search_prefix}package-lock.json"
              fi
              for bun_lockfile in bun.lock bun.lockb; do
                if grep -qxF "${search_prefix}${bun_lockfile}" <<< "$lockfiles"; then
                  uses_bun=true
                  lockfile_source="${lockfile_source:+${lockfile_source} and }${search_prefix}${bun_lockfile}"
                fi
              done
              if [ -n "$lockfile_source" ]; then return 0; fi
              if [ "$search_directory" = "." ]; then break; fi
              search_directory="$(dirname "$search_directory")"
            done
            uses_npm=true
            uses_bun=true
          }

          # Bun states the window in seconds, npm in days. Deriving one from the
          # other means the two files cannot be raised out of step.
          min_release_age_seconds=$((MIN_RELEASE_AGE_DAYS * 86400))

          # Read one key from an ini/TOML-style config.
          #   $1 file, $2 section ("" for a file without sections), $3 key
          # Prints the last value assigned to that key inside that section, and
          # nothing when it is absent. Last-one-wins because that is how both
          # parsers resolve a key that appears twice.
          read_setting() {
            awk -v want_section="$2" -v want_key="$3" '
              # A [header] line switches the section every later key belongs to.
              # .npmrc has no sections, so its keys stay in the empty section.
              /^[[:space:]]*\[/ {
                section = $0
                gsub(/[][[:space:]]/, "", section)
                next
              }
              {
                line = $0
                sub(/[#;].*/, "", line)   # strip trailing comments
                eq = index(line, "=")
                if (eq == 0) next
                key = substr(line, 1, eq - 1)
                value = substr(line, eq + 1)
                gsub(/^[ \t]+|[ \t]+$/, "", key)
                gsub(/^[ \t]+|[ \t]+$/, "", value)
                gsub(/^"|"$/, "", value)
                if (key == want_key && section == want_section) found = value
              }
              END { if (found != "") print found }
            ' "$1"
          }

          # $1 file, $2 section, $3 key, $4 floor, $5 unit, $6 how to fix
          check_cooldown() {
            if [ ! -f "$1" ]; then
              fail "$1" "$1 is missing — $6"
              return
            fi
            value="$(read_setting "$1" "$2" "$3")"
            if [ -z "$value" ]; then
              fail "$1" "$1 does not set $3 — $6"
            elif ! printf '%s' "$value" | grep -Eq '^[0-9]+$'; then
              fail "$1" "$1 sets $3 to '$value', which is not a whole number — $6"
            elif [ "$value" -lt "$4" ]; then
              fail "$1" "$1 sets $3 to ${value}$5, below the required ${4}$5"
            else
              pass "$1 sets $3 to ${value}$5"
            fi
          }

          # A manifest that declares nothing to install has no quarantine window
          # to enforce, so demanding configuration beside it would be noise —
          # and test fixtures are mostly manifests of exactly that kind. A
          # `workspaces` key counts as declaring installs even with no
          # dependencies of its own, because installing from there resolves the
          # whole workspace tree.
          declares_installs() {
            jq -e '
              ([.dependencies, .devDependencies, .optionalDependencies, .peerDependencies]
                | map(if . == null then 0 else length end) | add) > 0
              or (.workspaces != null)
            ' "$1" >/dev/null 2>&1
          }

          # Semicolon-separated globs a repository has declared irrelevant.
          # Matched with `case`, so the caller's patterns are shell globs.
          is_excluded() {
            [ -n "$QUARANTINE_EXCLUDE" ] || return 1
            saved_ifs="$IFS"
            IFS=';'
            for pattern in $QUARANTINE_EXCLUDE; do
              [ -n "$pattern" ] || continue
              # shellcheck disable=SC2254
              case "$1" in
                $pattern)
                  IFS="$saved_ifs"
                  return 0
                  ;;
              esac
            done
            IFS="$saved_ifs"
            return 1
          }

          for manifest in $manifests; do
            if is_excluded "$manifest"; then
              printf '\n%s — excluded by quarantine-exclude\n' "$manifest"
              continue
            fi

            if ! jq -e . "$manifest" >/dev/null 2>&1; then
              printf '\n%s\n' "$manifest"
              fail "$manifest" "$manifest is not valid JSON, so what it installs cannot be determined"
              continue
            fi

            if ! declares_installs "$manifest"; then
              printf '\n%s — declares no dependencies, nothing to quarantine\n' "$manifest"
              continue
            fi

            # Both package managers resolve configuration from the directory the
            # install runs in, not from the repository root: npm stops at the
            # nearest ancestor holding a package.json, and Bun stops at the
            # workspace root. A config file at the root is therefore never read
            # by an install run inside a package that carries its own manifest.
            # Requiring the files beside each manifest is the only placement that
            # holds for every install location — including the loose monorepo,
            # where a root config is read by nothing at all.
            directory="$(dirname "$manifest")"
            if [ "$directory" = "." ]; then prefix=""; else prefix="${directory}/"; fi
            checked=$((checked + 1))

            printf '\n%s\n' "${prefix:-./}"

            detect_package_managers "$directory"
            if [ -n "$lockfile_source" ]; then
              printf '  package manager from %s\n' "$lockfile_source"
            else
              printf '  no lockfile at or above — npm and Bun configuration both required\n'
            fi

            if [ "$uses_npm" = true ]; then
              check_cooldown "${prefix}.npmrc" "" "min-release-age" \
                "$MIN_RELEASE_AGE_DAYS" " days" \
                "add 'min-release-age=${MIN_RELEASE_AGE_DAYS}'"
            fi
            if [ "$uses_bun" = true ]; then
              check_cooldown "${prefix}bunfig.toml" "install" "minimumReleaseAge" \
                "$min_release_age_seconds" "s" \
                "add 'minimumReleaseAge = ${min_release_age_seconds}' under [install]"
            fi

            # A committed .npmrc is the classic place a registry token ends up,
            # because it works locally and nothing complains. An ${ENV} reference
            # is fine — npm expands it at install time and the committed file
            # reveals nothing.
            if [ -f "${prefix}.npmrc" ]; then
              # `|| true` because no credentials is the normal case: grep exits
              # 1 when it matches nothing, and under the runner's errexit that
              # would end the step on exactly the repositories that are clean.
              credential_lines="$(grep -nE '(_auth|_authToken|_password)[[:space:]]*=' "${prefix}.npmrc" |
                grep -v '\${' | cut -d: -f1 | paste -sd, -)" || true
              if [ -n "$credential_lines" ]; then
                fail "${prefix}.npmrc" "${prefix}.npmrc carries a literal credential on line(s) ${credential_lines} — move it to an \${ENV} reference and rotate the value"
              else
                pass "${prefix}.npmrc carries no literal credentials"
              fi
            fi

            # bun.lockb is Bun's binary lockfile. It is not itself a
            # vulnerability; it is unreadable in a diff, so a dependency change
            # cannot be reviewed and the quarantine window is the only thing left
            # guarding it. Warned rather than failed: converting needs a Bun run,
            # and failing every affected repository at once would block work to
            # make a point.
            if [ -f "${prefix}bun.lockb" ]; then
              warn "${prefix}bun.lockb" "${prefix}bun.lockb is binary, so dependency changes are unreviewable in a pull request — convert with 'bun install --save-text-lockfile'"
            elif [ -f "${prefix}bun.lock" ]; then
              pass "${prefix}bun.lock is the reviewable text lockfile"
            fi
          done

          printf '\n%s install location(s) checked\n' "$checked"
          if [ "$failures" -gt 0 ]; then
            printf '%s quarantine check(s) failed\n' "$failures"
            exit 1
          fi
