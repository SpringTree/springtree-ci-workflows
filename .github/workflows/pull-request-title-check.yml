# This repository checks its own pull request titles with the shared check.
#
name: pull-request-title

on:
  pull_request:
    # edited reruns the check when only the title changes.
    types: [opened, edited, reopened, synchronize]

# A newer title or push makes the running check irrelevant.
concurrency:
  group: pull-request-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-title:
    uses: ./.github/workflows/pull-request-title.yml
    permissions:
      contents: read
      pull-requests: read
